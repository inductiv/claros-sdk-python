[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claros-sdk"
version = "1.5.0"
description = "Python SDK for ClarOS Platform services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
clickhouse = [
    "clickhouse-connect>=1.9.0",
]
google = [
    "google-api-python-client>=2.200.0",
    "google-api-python-client-stubs>=1.40.0",
    "google-auth>=2.57.1",
    "google-auth-httplib2>=0.4.2",
]
stripe = [
    "stripe>=15.6.1",
]
all = [
    "claros-sdk[google,stripe,clickhouse]",
]

[tool.hatch.build.targets.wheel]
packages = ["claros_sdk"]

[dependency-groups]
dev = [
    "fastapi>=0.141.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]
