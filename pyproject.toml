[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claros-sdk"
version = "0.1.0"
description = "Python SDK for ClarOS Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "starlette>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.141.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["claros_sdk"]

[dependency-groups]
dev = [
    "fastapi>=0.141.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]
